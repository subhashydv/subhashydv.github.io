baseURL = "https://subhashydv.github.io/"
languageCode = "en-us"
title = "Hugo Atlantic"
themesDir = "themes"
theme = "hugo-atlantic-theme"


enableGitInfo = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClasses = true
metaDataFormat = "yaml"
paginate = 5

[params]
  google_analytics_id = "G-0MRZD7E3EQ"  # Add your Google Analytics ID here (e.g., "G-XXXXXXXXXX" or "UA-XXXXXXXXX-X")
  
  # Enable built-in Hugo features
  enableRobotsTXT = true
  enableEmoji = true

  [params.homepage]
    postLimit = 5
    
  [params.logo]
    showLogoTextOnDesktop = true
    showLogoTextOnMobile = true
    showLogoImageOnDesktop = true
    showLogoImageOnMobile = true
    logoDesktopText = "Supreme Viki"
    logoDesktopImage = "images/logo/logo.png"
    logoMobileText = "Supreme Viki"
    logoMobileImage = "images/logo/logo.png"
    logoDesktopImageHeight = 100
    logoDesktopImageWidth = 100
    logoMobileImageHeight = 100
    logoMobileImageWidth = 100

  [params.fonts]
    google_fonts = "https://fonts.googleapis.com/css2?family=Fira+Mono&family=Lato:wght@300;400;700&family=Source+Sans+Pro&display=swap"
    heading = "Lato"
    base = "Source Sans Pro"
    monospace = "Fira Mono"

  [params.seo]
    meta_twitter_site = "@subhashydv"  # Replace with your Twitter handle
    meta_twitter_creator = "@subhashydv"  # Replace with your Twitter handle
    meta_og_image = "https://subhashydv.github.io/images/logo/logo.png"  # Your default OG image
    meta_description = "Tech blog by Subhash Yadav covering software development, distributed systems, and modern technologies"
    meta_keywords = "software development, kafka, kubernetes, terraform, distributed systems, tech blog"

[build]
  writeStats = true

[permalinks]
    posts = "blog/:year/:month/:title/"
    pages = ":slug/"

[taxonomies]
    tag = "tags"
    category = "categories"
    author = "authors"
  
# Main Menu
[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

[[menu.main]]
    name = "Github"
    url = "https://github.com/subhashydv"
    weight = 2

[[menu.main]]
    name = "About Author"
    url = "https://subhashydv.github.io/subhashydv/"
    weight = 3

rssLimit = 20
copyright = "2022 Supreme Viki All rights reserved"
languageCode = "en-us"

[author]
	name = "Subhash Yadav"
	email = "subhashyadavtw@gmail.com"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[privacy]
  [privacy.googleAnalytics]
    respectDoNotTrack = true
    anonymizeIP = true

# Markup settings for SEO
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
